databases:
  - name: tracktime-db
    databaseName: pointage
    user: render_user
    plan: free

services:
  - type: web
    name: tracktime-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn attendance_system.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tracktime-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
    plan: free
